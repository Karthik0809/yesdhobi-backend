# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard -> New -> Blueprint -> pick this repo. Creates the API service.
# Supply DATABASE_URL (Supabase pooler URI) when prompted; everything else has a default.
services:
  - type: web
    name: yesdhobi-api            # => https://yesdhobi-api.onrender.com (already used by the vendor website)
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false               # paste the Supabase *transaction pooler* URI (port 6543, ?pgbouncer=true)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OTP_DEV_MODE
        value: "true"             # switch to "false" once an SMS provider is configured
      - key: SMS_PROVIDER
        value: console
      - key: CORS_ORIGINS
        value: "*"                # tighten to your admin/website origins before launch
      - key: PUBLIC_BASE_URL
        value: https://yesdhobi-api.onrender.com
      - key: SEED_ADMIN_EMAIL
        value: admin@yesdhobi.com
      - key: SEED_ADMIN_PASSWORD
        sync: false
